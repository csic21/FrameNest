name: Japanese Android pipeline benchmark

# Dedicated fixture/test changes opt into heavy downloads; unrelated PRs do not.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/japanese-benchmark.yml
      - app/src/androidTest/java/com/framenest/feature/listen_translate/JapanesePipelineAcceptanceTest.kt
      - app/src/androidTest/assets/japanese-benchmark/**
      - scripts/prepare-japanese-benchmark.py

permissions:
  contents: read

concurrency:
  group: japanese-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    # Heavy runtime validation is explicit after the approved one-run experiment.
    # A skipped PR job is not runtime acceptance evidence.
    if: github.run_number == 24 && github.run_attempt == 1
    name: Real PCM · SenseVoice · ML Kit + Hy · overlay
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install only SDK packages covered by existing runner licenses
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' emulator 'system-images;android-35;google_apis;x86_64' 'ndk;28.2.13676358' 'cmake;3.22.1' < /dev/null
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
      - name: Install official Ubuntu emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0 libnss3 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
      # Owner approval is limited to this one next run, first attempt only.
      # Later runs never inherit this device-access grant.
      - name: Grant approved one-run KVM access to current runner only
        if: github.run_number == 24 && github.run_attempt == 1
        run: |
          test -c /dev/kvm
          command -v setfacl || { sudo apt-get update && sudo apt-get install --no-install-recommends -y acl; }
          getfacl -p /dev/kvm > "$RUNNER_TEMP/framenest-kvm-original.acl"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          touch "$RUNNER_TEMP/framenest-kvm-granted"
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: false
      - name: Download pinned licensed media fixture
        timeout-minutes: 4
        run: python3 scripts/prepare-japanese-benchmark.py
      - name: Build app and test APKs
        run: |
          ./gradlew -PhyMtNative=true assembleDebug assembleDebugAndroidTest --stacktrace
          python3 scripts/check_hy_native_apk.py app/build/outputs/apk/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-universal-debug.apk
          mkdir -p benchmark-results
          for abi in arm64-v8a x86_64; do
            commands=$(find app/.cxx/Debug -path "*/$abi/compile_commands.json" -print -quit)
            test -n "$commands"
            python3 app/src/main/cpp/tests/check_build_flags.py "$commands" --debug | tee "benchmark-results/native-build-flags-$abi.json"
          done
          ./gradlew --stop
      - name: Start isolated emulator without accepting new licenses or changing host permissions
        timeout-minutes: 12
        run: |
          mkdir -p benchmark-results
          export ANDROID_AVD_HOME="$RUNNER_TEMP/framenest-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name japanese-benchmark --path "$ANDROID_AVD_HOME/japanese-benchmark.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/japanese-benchmark.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          # Reuse accessible KVM; the only permission grant is the guarded one-run step.
          ACCEL=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL=on; fi
          printf 'acceleration=%s\n' "$ACCEL" > benchmark-results/environment.txt
          "$ANDROID_HOME/emulator/emulator" -version >> benchmark-results/environment.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd japanese-benchmark -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel "$ACCEL" -memory 4096 -partition-size 8192 -cores 2 > benchmark-results/emulator.log 2>&1 &
          EMULATOR_PID=$!
          export EMULATOR_PID
          timeout 600 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do kill -0 "$EMULATOR_PID" || { cat benchmark-results/emulator.log; exit 1; }; sleep 5; done'
          adb shell input keyevent 82
          adb shell getprop ro.build.fingerprint >> benchmark-results/environment.txt
      - name: Install and execute real Japanese pipeline test
        timeout-minutes: 30
        run: |
          adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          set -o pipefail
          adb logcat -c
          timeout 180 adb shell am instrument -w -r \
            -e class com.framenest.AppDisplayNameTest \
            com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
            | tee benchmark-results/startup-smoke.txt
          grep -Eq '^OK \(2 tests\)' benchmark-results/startup-smoke.txt
          timeout 1650 adb shell am instrument -w -r \
            -e class com.framenest.feature.listen_translate.JapanesePipelineAcceptanceTest \
            -e japaneseBenchmark true \
            com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
            | tee benchmark-results/instrumentation.txt
          # am instrument can exit zero even when tests fail; require exact success and JSON.
          grep -Eq '^OK \(1 test\)' benchmark-results/instrumentation.txt
          adb exec-out run-as com.framenest cat files/japanese-benchmark.json > benchmark-results/japanese-benchmark.json
          python3 - <<'PY'
          import json
          p = json.load(open('benchmark-results/japanese-benchmark.json'))
          assert p.get('functional_acceptance_passed') is True
          assert len(p['runs']) == 2 and all(r.get('passed') is True for r in p['runs'])
          PY
      - name: Verify bounded overlay on phone and tablet configurations
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout 240 adb shell am instrument -w -r \
            -e class com.framenest.feature.listen_translate.ListenTranslateOverlayTest \
            com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
            | tee benchmark-results/overlay.txt
          grep -Eq '^OK \(10 tests\)' benchmark-results/overlay.txt
      # Fail fast on the native controls: a slow/broken engine must not spend
      # another 30 minutes in the recorded producer before preserving diagnostics.
      - name: Verify real Hy JNI controls cancellation reuse and close
        timeout-minutes: 32
        run: |
          set -o pipefail
          echo "HY_ACCEPTANCE_DEADLINE=$(( $(date +%s) + 2250 ))" >> "$GITHUB_ENV"
          timeout 1860 adb shell am instrument -w -r \
            -e class 'com.framenest.feature.listen_translate.mt.HyMtNativeAcceptanceTest#realNativeControlsCancellationReuseAndClose' \
            -e runHyMtBenchmark true \
            -e hyMtAllowMeteredDownloads true \
            com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
            | tee benchmark-results/hy-controls-instrumentation.txt
          grep -Eq '^OK \(1 test\)' benchmark-results/hy-controls-instrumentation.txt
          adb exec-out run-as com.framenest cat files/hy-mt-native-acceptance.json > benchmark-results/hy-mt-native-acceptance.json
          python3 -c "import json; assert json.load(open('benchmark-results/hy-mt-native-acceptance.json')).get('functional_acceptance_passed') is True"
      - name: Verify real Hy recorded-file production path
        timeout-minutes: 32
        run: |
          set -o pipefail
          remaining=$(( HY_ACCEPTANCE_DEADLINE - $(date +%s) ))
          test "$remaining" -gt 0
          if [ "$remaining" -gt 1860 ]; then remaining=1860; fi
          timeout "$remaining" adb shell am instrument -w -r \
            -e class 'com.framenest.feature.listen_translate.mt.HyMtNativeAcceptanceTest#recordedProducerOnPinnedPublicJapaneseFixture' \
            -e runHyMtBenchmark true \
            -e hyMtAllowMeteredDownloads true \
            com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
            | tee benchmark-results/hy-recorded-instrumentation.txt
          grep -Eq '^OK \(1 test\)' benchmark-results/hy-recorded-instrumentation.txt
          adb exec-out run-as com.framenest cat files/hy-mt-recorded-fixture-acceptance.json > benchmark-results/hy-mt-recorded-fixture-acceptance.json
          python3 -c "import json; assert json.load(open('benchmark-results/hy-mt-recorded-fixture-acceptance.json')).get('functional_acceptance_passed') is True"
          # Semantic and device-speed acceptance require review of actual outputs.
      - name: Collect bounded metrics and public-fixture review only
        if: always()
        run: |
          mkdir -p benchmark-results
          adb exec-out run-as com.framenest cat files/japanese-benchmark.json > benchmark-results/japanese-benchmark.partial.json 2>/dev/null || true
          for name in hy-mt-native-acceptance hy-mt-recorded-fixture-acceptance; do
            adb exec-out run-as com.framenest cat "files/$name.json" > "benchmark-results/$name.partial.json" 2>/dev/null || true
          done
          cp app/src/androidTest/assets/japanese-benchmark/manifest.json benchmark-results/fixture-license.json
          adb exec-out run-as com.framenest cat files/japanese-fixture-review.json > benchmark-results/japanese-fixture-review.json 2>/dev/null || true
          adb exec-out run-as com.framenest cat files/japanese-benchmark-phase.txt > benchmark-results/phase.txt 2>/dev/null || true
          # Fresh disposable emulator contains only the public fixture and this app.
          # Crash buffer is required to diagnose instrumentation startup/native crashes.
          adb logcat -b crash -d -t 300 > benchmark-results/fixture-crash.txt 2>/dev/null || true
          adb shell dumpsys activity exit-info com.framenest > benchmark-results/fixture-exit-info.txt 2>/dev/null || true
          # Text is allowed only for the hash-pinned public licensed fixture review.
          # Do not collect general logcat, app databases, user/NAS subtitle text, or audio.
          adb emu kill || true
      - name: Restore original KVM ACL after the approved run
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/framenest-kvm-granted" ]; then
            sudo setfacl --restore="$RUNNER_TEMP/framenest-kvm-original.acl"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: japanese-android-pipeline-measurements
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: error
