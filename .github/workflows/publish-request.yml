name: Publish requested release

# A separate request commit pins the already integrated/tested source. Ordinary
# code pushes, tags, pull requests and forks cannot start publication.
on:
  push:
    branches: [main]
    paths: [.github/release-request.json]

permissions:
  contents: read

concurrency:
  group: publish-framenest-release-request
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  request:
    name: Validate explicit release request
    if: github.repository == 'csic21/FrameNest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source, version and request-only commit
        id: request
        run: python3 scripts/release.py validate-request
      - name: Test release guards and interrupted publication
        run: python3 -m unittest discover -s scripts/tests -v

  android:
    name: Check source and build signed APKs
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.request.outputs.source_sha }}
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install exact supported SDK
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" < /dev/null
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Signing stays outside the repository/cache. Never cache a release
          # build's configuration or signing inputs back into shared CI caches.
          cache-read-only: true
      - name: Check exact source and run release script tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          python3 -m unittest discover -s scripts/tests -v
      - name: Unit tests, lint and instrumentation compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon --no-configuration-cache --stacktrace
      - name: Verify owner-confirmed signing key, build and verify release APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/framenest-release.jks
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/release.py prepare-signing --keystore "$ANDROID_KEYSTORE_PATH"
          # Do not pass key values as command-line arguments or Gradle properties.
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace
          python3 scripts/release.py package --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/framenest-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: framenest-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framenest-release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Verify assets, publish and check public update feed
    needs: [request, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This is the only job with repository write access. No PAT is needed.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.request.outputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.request.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Publish without moving tags or overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
