name: SenseVoice Android runtime comparison

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sensevoice-runtime-comparison.yml
      - app/src/androidTest/java/com/framenest/feature/listen_translate/SenseVoiceRuntimeComparisonTest.kt
      - app/src/androidTest/assets/runtime-comparison/**
      - scripts/prepare-sensevoice-runtime-comparison.py

permissions:
  contents: read

concurrency:
  group: sensevoice-runtime-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    # Same approved ABBA action retry; previous runner restored its original ACL.
    if: github.run_number == 8 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install supported SDK without accepting new licenses
        run: |
          set -euxo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' emulator 'system-images;android-35;google_apis;x86_64' < /dev/null
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
      - name: Install official fixture and emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libpulse0 libnss3 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6
          command -v ffmpeg
          ffmpeg -version
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Prepare byte-identical public inputs once for both complete APKs
        run: |
          set -euo pipefail
          mkdir -p runtime-results/apks/{baseline,candidate}
          python3 -m unittest discover -s scripts/tests -p 'test_prepare_sensevoice_runtime_comparison.py' -v
          python3 scripts/prepare-sensevoice-runtime-comparison.py --download --source-dir "$RUNNER_TEMP/fn74-inputs" --report runtime-results/input-preparation.json 2>&1 | tee runtime-results/input-preparation.log
          git rev-parse HEAD > runtime-results/source-sha.txt
          ffmpeg -version > runtime-results/ffmpeg-version.txt
      - name: Build actual old-native and new-native APK pairs
        run: |
          for profile in baseline candidate; do
            baseline=false
            test "$profile" != baseline || baseline=true
            ./gradlew -PhyMtNative=false -PsherpaRuntimeBaseline="$baseline" assembleDebug assembleDebugAndroidTest --stacktrace
            python3 scripts/check_android_test_signatures.py app/build --path-contains androidtest
            cp app/build/outputs/apk/debug/app-x86_64-debug.apk "runtime-results/apks/$profile/app.apk"
            cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "runtime-results/apks/$profile/test.apk"
          done
          (cd runtime-results && sha256sum apks/*/*.apk > apk-sha256.txt)
          test "$(sha256sum runtime-results/apks/baseline/app.apk | cut -d' ' -f1)" != "$(sha256sum runtime-results/apks/candidate/app.apk | cut -d' ' -f1)"
          ./gradlew --stop
      - name: Grant approved one-run current-user KVM access
        if: github.run_number == 8 && github.run_attempt == 1
        run: |
          set -euo pipefail
          test -c /dev/kvm
          command -v setfacl || { sudo apt-get update && sudo apt-get install --no-install-recommends -y acl; }
          getfacl -p /dev/kvm > "$RUNNER_TEMP/fn74-kvm-original.acl"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Start isolated emulator only with already-authorized acceleration
        timeout-minutes: 12
        run: |
          # Only this run received a current-user ACL above.
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fn74-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name fn74 --path "$ANDROID_AVD_HOME/fn74.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd fn74 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 4096 -partition-size 8192 -cores 2 > runtime-results/emulator.log 2>&1 &
          PID=$!
          export PID
          timeout 600 bash -c 'until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do kill -0 "$PID" || exit 1; sleep 5; done'
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell getprop ro.build.fingerprint > runtime-results/environment.txt
          adb -s emulator-5554 shell getconf PAGE_SIZE >> runtime-results/environment.txt
      - name: Run real native comparison in ABBA order with fresh app processes
        timeout-minutes: 35
        run: |
          set -euo pipefail
          i=0
          for profile in baseline candidate candidate baseline; do
            i=$((i+1))
            version=1.13.8
            test "$profile" != baseline || version=1.12.32
            adb -s emulator-5554 uninstall com.framenest.test >/dev/null 2>&1 || true
            adb -s emulator-5554 uninstall com.framenest >/dev/null 2>&1 || true
            adb -s emulator-5554 install "runtime-results/apks/$profile/app.apk"
            adb -s emulator-5554 install "runtime-results/apks/$profile/test.apk"
            adb -s emulator-5554 logcat -c
            timeout 420 adb -s emulator-5554 shell am instrument -w -r \
              -e class com.framenest.feature.listen_translate.SenseVoiceRuntimeComparisonTest \
              -e runtimeComparison true -e expectedRuntime "$version" \
              com.framenest.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "runtime-results/$i-$profile-instrumentation.txt"
            adb -s emulator-5554 logcat -d > "runtime-results/$i-$profile-logcat.txt"
            grep -Eq '^OK \(1 test\)' "runtime-results/$i-$profile-instrumentation.txt"
            adb -s emulator-5554 exec-out run-as com.framenest cat files/sensevoice-runtime-comparison.json > "runtime-results/$i-$profile.json"
          done
      - name: Collect partial results even after a failed assertion
        if: always()
        run: |
          mkdir -p runtime-results
          timeout 15 adb -s emulator-5554 logcat -d > runtime-results/final-logcat.txt 2>&1 || true
          timeout 15 adb -s emulator-5554 exec-out run-as com.framenest cat files/sensevoice-runtime-comparison.json > runtime-results/last-partial-result.json 2>/dev/null || true
      - name: Stop emulator and restore original KVM ACL
        if: always()
        run: |
          timeout 15 adb -s emulator-5554 emu kill || true
          if test -f "$RUNNER_TEMP/fn74-kvm-original.acl"; then
            sudo setfacl --restore="$RUNNER_TEMP/fn74-kvm-original.acl"
            getfacl -p /dev/kvm > "$RUNNER_TEMP/fn74-kvm-restored.acl"
            diff -u "$RUNNER_TEMP/fn74-kvm-original.acl" "$RUNNER_TEMP/fn74-kvm-restored.acl"
          fi
      - name: Preserve diagnostics and complete paired APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sensevoice-runtime-comparison
          path: runtime-results/
          if-no-files-found: warn
          retention-days: 14
