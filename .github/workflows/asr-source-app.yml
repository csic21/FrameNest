name: Experimental source ASR app

on:
  workflow_dispatch:
  push:
    branches: ['experiment/FN-74-asr-source-app']
    paths:
      - '.github/workflows/asr-source-app.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/prepare_source_asr.py'
      - 'scripts/check_source_asr_apk.py'
      - 'scripts/collect_source_asr_pair.py'
      - 'scripts/check_android_test_signatures.py'
      - 'scripts/prepare-sensevoice-runtime-comparison.py'
      - 'scripts/tests/test_prepare_source_asr.py'
      - 'scripts/tests/test_check_source_asr_apk.py'
      - 'scripts/tests/test_collect_source_asr_pair.py'
      - 'scripts/tests/test_check_android_test_signatures.py'
      - 'scripts/tests/test_prepare_sensevoice_runtime_comparison.py'
      - 'scripts/tests/test_source_runtime_profile.py'
      - 'docs/experiments/FN-74-asr-source-app/artifact-lock.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: asr-source-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-audit:
    name: Exact source AAR · app compile and static APK audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout independent experiment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare evidence and test fail-closed import/audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-app-evidence"
          python3 -m unittest discover -s scripts/tests -p 'test_*source_asr*.py' -v 2>&1 | tee "$RUNNER_TEMP/source-app-evidence/python-tests.log"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          record = {'github': {k: os.environ.get(k) for k in ['GITHUB_REPOSITORY','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']},
                    'image': {k: os.environ.get(k) for k in ['ImageOS','ImageVersion']},
                    'platform': platform.platform(), 'java': subprocess.run(['java','-version'],capture_output=True,text=True).stderr,
                    'runtime_executed': False, 'kvm_used': False, 'release_approved': False}
          (Path(os.environ['RUNNER_TEMP'])/'source-app-evidence/host.json').write_text(json.dumps(record,indent=2)+'\n')
          PY

      - name: Import exact reviewed same-repository AAR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare_source_asr.py --download \
            --archive "$RUNNER_TEMP/reviewed-aar.zip" \
            --report "$RUNNER_TEMP/source-app-evidence/source-aar-import.json"
          FN74_SOURCE_AAR="$PWD/app/libs/sherpa-onnx-1.13.8-asr-no-tts.aar" \
            python3 -m unittest discover -s scripts/tests -v

      - name: Set up existing Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Require previously accepted SDK license and install stable packages
        run: |
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" < /dev/null
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Assemble source-profile debug APKs
        run: |
          set -o pipefail
          ./gradlew -PsherpaAsrSource=true -PhyMtNative=false --dependency-verification strict --no-build-cache assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/source-app-evidence/assemble.log"

      - name: Run source-profile unit tests
        run: |
          set -o pipefail
          ./gradlew -PsherpaAsrSource=true -PhyMtNative=false --dependency-verification strict testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/source-app-evidence/unit-tests.log"

      - name: Prepare the frozen public runtime-test inputs without running a device
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version > "$RUNNER_TEMP/source-app-evidence/ffmpeg-version.txt"
          for test in test_prepare_sensevoice_runtime_comparison.py test_check_android_test_signatures.py test_source_runtime_profile.py; do
            python3 -m unittest discover -s scripts/tests -p "$test" -v
          done
          python3 scripts/prepare-sensevoice-runtime-comparison.py --download \
            --source-dir "$RUNNER_TEMP/fn74-frozen-inputs" \
            --report "$RUNNER_TEMP/source-app-evidence/input-preparation.json" \
            2>&1 | tee "$RUNNER_TEMP/source-app-evidence/input-preparation.log"

      - name: Compile source-profile instrumentation APK only
        run: |
          set -o pipefail
          ./gradlew -PsherpaAsrSource=true -PhyMtNative=false --dependency-verification strict assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/source-app-evidence/instrumentation-compile.log"
          python3 scripts/check_android_test_signatures.py app/build --path-contains androidtest \
            2>&1 | tee "$RUNNER_TEMP/source-app-evidence/instrumentation-signatures.log"

      - name: Lint source profile
        run: |
          set -o pipefail
          ./gradlew -PsherpaAsrSource=true -PhyMtNative=false --dependency-verification strict lintDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/source-app-evidence/lint.log"

      - name: Audit exact embedded source natives, classes, notices and ZIP alignment
        run: |
          set -euo pipefail
          python3 scripts/check_source_asr_apk.py --aar app/libs/sherpa-onnx-1.13.8-asr-no-tts.aar \
            --report "$RUNNER_TEMP/source-app-evidence/apk-static-audit.json" --require-all-variants \
            app/build/outputs/apk/debug/*.apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" >> "$RUNNER_TEMP/source-app-evidence/zipalign.log"
          done
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk > "$RUNNER_TEMP/source-app-evidence/APK-SHA256SUMS"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk; do
            echo "$apk" >> "$RUNNER_TEMP/source-app-evidence/apk-signatures.log"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" >> "$RUNNER_TEMP/source-app-evidence/apk-signatures.log"
          done
          python3 scripts/collect_source_asr_pair.py --evidence "$RUNNER_TEMP/source-app-evidence"

      - name: Retain exact audited app and compiled test APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-asr-apks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/source-app-pair.json
            app/build/outputs/apk/apk-static-audit.json
            app/build/outputs/apk/input-preparation.json
            app/build/outputs/apk/fixture-manifest.json
            app/build/outputs/apk/source-profile.json
          retention-days: 14
          if-no-files-found: error

      - name: Retain compact build and static audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-asr-app-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-app-evidence/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            docs/experiments/FN-74-asr-source-app/artifact-lock.json
          retention-days: 14
          if-no-files-found: error
