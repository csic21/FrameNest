name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: checkout needs read; artifact upload needs actions write.
permissions:
  contents: read
  actions: write

# One run per branch; newer pushes cancel stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble · Unit tests · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Override v3's legacy `tools platform-tools` default.
          packages: platform-tools
          # Hosted runners already accept the stable SDK license. Do not bulk
          # accept unrelated preview/emulator agreements on every build.
          accept-android-sdk-licenses: false

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" < /dev/null
          # sdkmanager may return zero after skipping an unaccepted license.
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check official Maven availability before resolving dependencies
        run: |
          for path in org/jetbrains/annotations/13.0/annotations-13.0.pom com/google/code/gson/gson/2.11.0/gson-2.11.0.pom; do
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 30 \
              --output /dev/null --write-out 'Maven HTTP %{http_code}\n' "https://repo.maven.apache.org/maven2/$path"
          done
      - name: Assemble debug
        # Do not preserve transient repository not-found responses across runner caches.
        # Pinned dependency verification remains mandatory.
        run: ./gradlew assembleDebug --refresh-dependencies --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Compile and test fixed old-runtime baseline
        run: ./gradlew -PsherpaRuntimeBaseline=true -PhyMtNative=false assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace

      # Compile the explicitly opt-in engine without enabling downloads in the app.
      # This job uses no emulator/KVM device and creates no signing credentials.
      - name: Install pinned native build tools
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" < /dev/null
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Compile optional quality engine and instrumented tests
        run: ./gradlew -PhyMtNative=true assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --stacktrace

      - name: Audit actual optimized native Debug commands
        run: |
          python3 -m unittest discover -s app/src/main/cpp/tests -p 'test_check_build_flags.py' -v
          for abi in arm64-v8a x86_64; do
            commands=$(find app/.cxx/Debug -path "*/$abi/compile_commands.json" -print -quit)
            test -n "$commands"
            python3 app/src/main/cpp/tests/check_build_flags.py "$commands" --debug
          done

      - name: Check optional native ELF alignment
        run: |
          python3 scripts/check_hy_native_apk.py app/build/outputs/apk/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framenest-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
